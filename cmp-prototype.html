<title>CMP · Frontend interno — protótipo navegável</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16212b; --ink-soft:#5a6b7a;
  --line:#dbe2e8; --line-strong:#c3ced8;
  --accent:#0e7c86; --accent-strong:#0b5e66; --accent-soft:#e2f1f2;
  --ok:#1f9d6b; --ok-soft:#e3f4ec; --warn:#b9750f; --warn-soft:#fbefdb; --danger:#c4453d; --danger-soft:#f8e3e1;
  --shadow:0 1px 2px rgba(16,33,43,.06),0 8px 24px rgba(16,33,43,.06);
  --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0d141b; --surface:#131d26; --surface-2:#0f1820; --ink:#e6edf3; --ink-soft:#93a3b1;
  --line:#233240; --line-strong:#324454; --accent:#2aa7b0; --accent-strong:#5cc4cb; --accent-soft:#123037;
  --ok:#39b581; --ok-soft:#0f2c22; --warn:#d99a3c; --warn-soft:#2e2410; --danger:#e06a62; --danger-soft:#331917;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0d141b; --surface:#131d26; --surface-2:#0f1820; --ink:#e6edf3; --ink-soft:#93a3b1;
  --line:#233240; --line-strong:#324454; --accent:#2aa7b0; --accent-strong:#5cc4cb; --accent-soft:#123037;
  --ok:#39b581; --ok-soft:#0f2c22; --warn:#d99a3c; --warn-soft:#2e2410; --danger:#e06a62; --danger-soft:#331917;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --ground:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16212b; --ink-soft:#5a6b7a;
  --line:#dbe2e8; --line-strong:#c3ced8; --accent:#0e7c86; --accent-strong:#0b5e66; --accent-soft:#e2f1f2;
  --ok:#1f9d6b; --ok-soft:#e3f4ec; --warn:#b9750f; --warn-soft:#fbefdb; --danger:#c4453d; --danger-soft:#f8e3e1;
  --shadow:0 1px 2px rgba(16,33,43,.06),0 8px 24px rgba(16,33,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pill{display:inline-flex;align-items:center;gap:.35em;padding:.14em .6em;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.mute{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.us{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);padding:.12em .5em;border-radius:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:.5em .9em;border-radius:8px;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:.45em;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tag{font-size:.72rem;color:var(--ink-soft)}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb,var(--accent) 14%, transparent), transparent 60%), var(--ground);}
.login-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 32px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.brand small{display:block;color:var(--ink-soft);font-size:.78rem}
.langpick{display:flex;gap:6px;margin-bottom:16px}
.langpick button{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);border-radius:7px;padding:.25em .7em;font-size:.76rem;font-weight:700}
.langpick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.idp{display:flex;align-items:center;gap:12px;width:100%;justify-content:center;padding:.8em 1em;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);font-weight:700;color:var(--ink);font-size:.95rem;margin-top:6px}
.idp:hover{border-color:var(--accent)}
.idp .ms{display:inline-grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:18px;height:18px;gap:2px}
.idp .ms i:nth-child(1){background:#f25022}.idp .ms i:nth-child(2){background:#7fba00}
.idp .ms i:nth-child(3){background:#00a4ef}.idp .ms i:nth-child(4){background:#ffb900}
.login-foot{margin-top:20px;font-size:.78rem;color:var(--ink-soft);display:flex;gap:.5em;align-items:flex-start}
#app{display:none;min-height:100vh;grid-template-columns:248px 1fr;grid-template-rows:auto auto 1fr}
#app.on{display:grid}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .brand{margin:0}
.topbar .logo{width:32px;height:32px;border-radius:8px;font-size:.85rem}
.spacer{flex:1}
.toolbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:.42em .7em;border-radius:8px;font-size:.8rem;font-weight:600;display:inline-flex;gap:.45em;align-items:center}
.toolbtn:hover{color:var(--ink);border-color:var(--line-strong)}
.switch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.switch label{font-size:.68rem;color:var(--ink-soft);font-weight:700;letter-spacing:.04em}
.switch select{border:none;background:transparent;color:var(--ink);font-weight:700;font-size:.85rem;padding:.3em;border-radius:6px}
.langtog{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.langtog button{border:none;background:var(--surface);color:var(--ink-soft);padding:.35em .6em;font-size:.76rem;font-weight:800}
.langtog button.on{background:var(--accent);color:#fff}
.who{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.78rem}
.who small{display:block;color:var(--ink-soft);font-size:.72rem;line-height:1.1}
.side{background:var(--surface-2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.side .sec{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:.6em .7em;border-radius:9px;border:1px solid transparent;color:var(--ink);font-weight:600;font-size:.9rem;text-align:left;background:none;width:100%}
.nav:hover{background:var(--surface)}
.nav.active{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.nav.active .ic{color:var(--accent)}
.nav .ic{width:18px;text-align:center;color:var(--ink-soft)}
.nav .rq{margin-left:auto}
.nav[disabled]{opacity:.4;cursor:not-allowed}
main{padding:26px 30px 60px;overflow-x:hidden}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.page-head h1{font-size:1.5rem;letter-spacing:-.01em}
.page-head .sub{color:var(--ink-soft);font-size:.9rem;margin-top:3px;max-width:72ch}
.crumbs{font-size:.76rem;color:var(--ink-soft);margin-bottom:10px}
.reqbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 22px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.reqbar .lbl{font-size:.72rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
body.nospec .reqbar,body.nospec .us,body.nospec .req-inline{display:none!important}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
/* layout mobile: sem grid — os blocos empilham; barra lateral passa a tira horizontal */
@media(max-width:720px){
  #app.on{display:block}
  .topbar{position:sticky;top:0;gap:8px;padding:8px 12px}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);gap:6px;padding:10px 12px;-webkit-overflow-scrolling:touch}
  .side .sec{display:none}
  .nav{width:auto;flex:0 0 auto;white-space:nowrap;font-size:.82rem;padding:.5em .7em}
  .nav .rq{display:none}
  main{padding:18px 16px 60px}
  .page-head h1{font-size:1.25rem}
  .switch{padding:3px 6px}
}
.stat{padding:16px 18px}
.stat .k{font-size:.78rem;color:var(--ink-soft);font-weight:600}
.stat .v{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .m{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.panel{padding:0;overflow:hidden}
.panel h3{padding:14px 18px;border-bottom:1px solid var(--line);font-size:.98rem;display:flex;align-items:center;gap:10px}
.panel h3 .us{margin-left:auto}
.panel .body{padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.tabwrap{overflow-x:auto}
.mono{font-family:var(--mono);font-size:.82rem}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left;font-weight:600}
.chk{color:var(--ok);font-weight:800}.no{color:var(--line-strong)}
.role-h{font-family:var(--mono);font-size:.78rem}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .item{position:relative;padding:0 0 16px 4px}
.tl .item::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .when{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft)}
.note{font-size:.82rem;color:var(--ink-soft);display:flex;gap:.5em;align-items:flex-start;margin-top:10px}
.kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:.05em .4em;background:var(--surface-2)}
.banner{grid-column:1/3;background:var(--warn-soft);color:var(--warn);font-size:.78rem;font-weight:600;text-align:center;padding:5px;letter-spacing:.02em}
.req-inline{font-size:.78rem;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;gap:.6em;flex-wrap:wrap;align-items:baseline}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:.55em .7em;font-family:inherit;font-size:.9rem}
.editor{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);min-height:96px;padding:12px 14px;font-size:.88rem;line-height:1.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:.4em}
.langtabs{display:flex;gap:6px;margin-bottom:10px}
.langtabs .lt{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);border-radius:7px 7px 0 0;padding:.3em .8em;font-size:.78rem;font-weight:700}
.langtabs .lt.on{background:var(--surface);color:var(--accent-strong);border-bottom-color:var(--surface)}
.tchip{display:inline-flex;align-items:center;gap:.4em;font-weight:700}
/* editor de consentimentos (vista de cliente) */
.ctools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;margin-bottom:12px;font-size:.86rem}
.ctools .sep{flex:1}
.cb{width:19px;height:19px;border:2px solid var(--line-strong);border-radius:5px;display:inline-grid;place-items:center;cursor:pointer;flex:none;color:#fff;font-size:12px;font-weight:800;line-height:1;background:var(--surface);transition:background .12s,border-color .12s}
.cb.on,.cb.ind{background:var(--accent);border-color:var(--accent)}
.cbrow{display:inline-flex;align-items:center;gap:9px;cursor:pointer}
.ccat{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.ccat-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ccat-name{font-weight:600;flex:1}
.exp{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:.85rem;width:16px;padding:0}
.linklike{border:none;background:none;color:var(--accent-strong);cursor:pointer;font-weight:600;font-size:.78rem;text-decoration:underline;white-space:nowrap}
.ctext{padding:10px 14px 12px 42px;background:var(--surface-2);border-top:1px solid var(--line);font-size:.86rem;line-height:1.55}
.ctext-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin-bottom:5px;display:flex;gap:8px;align-items:center}
.csubs{padding:6px 12px 12px 42px;background:var(--surface-2);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.csub{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.9rem}
</style>

<section id="login">
  <div class="login-card">
    <div class="brand">
      <div class="logo">CMP</div>
      <div><strong id="lg-title">Gestão de Consentimentos</strong><small id="lg-sub">Frontend interno · Grupo CTT</small></div>
    </div>
    <div class="langpick">
      <button id="lp-pt" class="on" onclick="setLang('pt')">PT</button>
      <button id="lp-es" onclick="setLang('es')">ES</button>
    </div>
    <p id="lg-access" style="color:var(--ink-soft);font-size:.9rem;margin:0 0 4px"></p>
    <button class="idp" onclick="signIn()"><span class="ms"><i></i><i></i><i></i><i></i></span><span id="lg-btn"></span></button>
    <div class="login-foot"><span class="us">US-T1-01</span><span id="lg-note"></span></div>
  </div>
</section>

<div id="app">
  <div class="banner" id="banner"></div>
  <header class="topbar">
    <div class="brand"><div class="logo">CMP</div><strong style="font-size:.95rem" id="tb-title">Gestão de Consentimentos</strong></div>
    <span class="pill acc" id="tb-internal">Frontend interno</span>
    <div class="spacer"></div>
    <button class="toolbtn" id="specBtn" onclick="toggleSpec()"></button>
    <button class="toolbtn" onclick="toggleTheme()">◐ <span id="tb-theme">Tema</span></button>
    <div class="langtog"><button id="tg-pt" class="on" onclick="setLang('pt')">PT</button><button id="tg-es" onclick="setLang('es')">ES</button></div>
    <div class="switch"><label id="tb-tenant">EMPRESA</label>
      <select id="tenant" onchange="setTenant(this.value)"><option>CTT</option><option>CTT Express</option></select></div>
    <div class="switch"><label id="tb-profile">PERFIL</label>
      <select id="role" onchange="setRole(this.value)"></select></div>
    <div class="who"><div class="avatar" id="av">JR</div>
      <div><strong style="font-size:.82rem" id="whoName">João Rodrigues</strong><small id="whoRole">DPO_Admin</small></div></div>
  </header>
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

/* ===== Editor de consentimentos (vista de cliente, para o DPO_Admin) ===== */
function ensureCons(){
  state.cons=state.cons||{}; state.expanded=state.expanded||{}; state.textopen=state.textopen||{};
  if(!state.cons[state.tenant]){
    const m={}; (CONSENT_CAT[state.tenant]||[]).forEach(c=>{m[c.code]={}; c.subs.forEach(s=>m[c.code][s.id]=!!s.g);});
    state.cons[state.tenant]=m; state.expanded[state.tenant]=new Set(); state.textopen[state.tenant]=new Set();
  }
  return state.cons[state.tenant];
}
function catObj(code){return (CONSENT_CAT[state.tenant]||[]).find(c=>c.code===code);}
function catState(code){const subs=catObj(code).subs,c=ensureCons()[code];const on=subs.filter(s=>c[s.id]).length;return on===0?'none':on===subs.length?'all':'some';}
// Em nome do titular só se REVOGA (US-S1.2-09): conceder está bloqueado.
function cToggleSub(cat,sub){const m=ensureCons();if(m[cat][sub]){m[cat][sub]=false;updateCons();}}
function cRevokeCat(cat){catObj(cat).subs.forEach(s=>ensureCons()[cat][s.id]=false);updateCons();}
function cRevokeComm(){ensureCons();(CONSENT_CAT[state.tenant]||[]).filter(c=>c.tipo==='comm').forEach(c=>c.subs.forEach(s=>state.cons[state.tenant][c.code][s.id]=false));updateCons();}
function cExp(cat){ensureCons();const S=state.expanded[state.tenant];S.has(cat)?S.delete(cat):S.add(cat);updateCons();}
function cTxt(cat){ensureCons();const S=state.textopen[state.tenant];S.has(cat)?S.delete(cat):S.add(cat);updateCons();}
function cExpandAll(v){ensureCons();const S=state.expanded[state.tenant];S.clear();if(v)(CONSENT_CAT[state.tenant]||[]).forEach(c=>S.add(c.code));updateCons();}
function box(kind){const cls=kind==='all'?'cb on':kind==='some'?'cb ind':'cb';const g=kind==='all'?'✓':kind==='some'?'–':'';return `<span class="${cls}">${g}</span>`;}
function renderConsentEditor(){
  ensureCons();const cats=CONSENT_CAT[state.tenant]||[];const exp=state.expanded[state.tenant],txo=state.textopen[state.tenant];
  // formulário de origem/prova do pedido (US-S2.1-11) — obrigatório
  let h=`<p style="margin:0 0 10px;font-size:.88rem">${t("subjectEditNote")}</p>
   <div class="note" style="margin:0 0 12px">⚠️ ${t("obRevokeOnly")}</div>
   <div class="card" style="padding:12px 14px;margin-bottom:14px;box-shadow:none">
     <div class="ctext-h" style="margin-bottom:8px">🧾 ${t("obTitle")} <span class="us">US-S2.1-11</span></div>
     <div class="grid g3">
       <div class="field" style="margin:0"><label>${t("obChannel")} *</label>
         <select><option>${t("chPhone")}</option><option>${t("chDesk")}</option><option>${t("chEmail")}</option><option>${t("chLetter")}</option></select></div>
       <div class="field" style="margin:0"><label>${t("obRef")} *</label><input placeholder="REQ-2026-000123"></div>
       <div class="field" style="margin:0"><label>${t("colWhen")} *</label><input value="2026-08-11"></div>
     </div>
     <div class="note" style="margin-top:8px">${t("obReq")}</div>
   </div>
   <div class="ctools">
     <button class="btn" style="border-color:var(--danger);color:var(--danger)" onclick="cRevokeComm()">${t("revokeAllComm")}</button>
     <span class="sep"></span>
     <button class="linklike" onclick="cExpandAll(true)">${t("cExpand")}</button>
     <button class="linklike" onclick="cExpandAll(false)">${t("cCollapse")}</button>
   </div>`;
  h+=cats.map(c=>{
    const st=catState(c.code),isExp=exp.has(c.code),isTxt=txo.has(c.code);
    return `<div class="ccat">
      <div class="ccat-h">
        <span class="${st==='none'?'cb':'cb on'}" style="cursor:${st==='none'?'default':'pointer'}" ${st==='none'?'':`onclick="cRevokeCat('${c.code}')"`} title="${st==='none'?'':t("revokeCat")}">${st==='all'?'✓':st==='some'?'–':''}</span>
        <button class="exp" onclick="cExp('${c.code}')">${isExp?'▾':'▸'}</button>
        <span class="ccat-name">${L(c.name)}</span>
        <span class="pill mute">${c.ver}</span>${tipo(c.tipo)}
        <button class="linklike" onclick="cTxt('${c.code}')">${isTxt?t("cHideText"):t("cViewText")}</button>
      </div>
      ${isTxt?`<div class="ctext"><div class="ctext-h">📄 ${t("cInForce")} <span class="us">${c.ver}</span> <span class="pill mute">${state.lang.toUpperCase()}</span> · dotCMS</div>${L(c.text)}</div>`:''}
      ${isExp?`<div class="csubs">${c.subs.map(s=>{const on=ensureCons()[c.code][s.id];
         return on
           ? `<label class="csub" onclick="cToggleSub('${c.code}','${s.id}')" title="${t("revokeCat")}"><span class="cb on">✓</span> ${L(s.label)}</label>`
           : `<label class="csub" style="opacity:.55;cursor:not-allowed" title="${t("grantBlocked")}"><span class="cb">🔒</span> ${L(s.label)}</label>`;}).join('')}</div>`:''}
    </div>`;
  }).join('');
  return h;
}

  <div class="card panel"><h3>${t("previousExtractions")} · 🏢 ${state.tenant}</h3>
   ${exts.length===0?`<div style="padding:16px;color:var(--ink-soft)">${t("noExtractions")}</div>`:
   `<div style="display:flex;flex-direction:column;gap:10px;padding:16px">${exts.map(e=>{
    const status=e.status==='completed'?t("statusCompleted"):t("statusProcessing");
    const actions=e.status==='completed'
      ? `<div style="display:flex;gap:6px">${actBtn(t("downloadJSON"),"extractions.view")} ${actBtn(t("downloadCSV"),"extractions.view")}</div>`
      : `<div style="font-size:.75rem;color:var(--ink-soft)">${t("statusProcessing")}…</div>`;
    return `<div class="card" style="padding:12px 14px;box-shadow:none;border:1px solid var(--line)">
     <div style="display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:8px">
      <div>
       <div style="font-weight:600;font-size:.9rem"><span class="mono">${e.id}</span></div>
       <div style="font-size:.8rem;color:var(--ink-soft);margin-top:2px">${e.ts} · ${e.by.name} (${e.by.role})</div>
      </div>
      <div style="text-align:right;font-size:.8rem">${status}</div>
     </div>
     <div style="font-size:.8rem;color:var(--ink-soft);margin-bottom:8px">
      📅 ${e.period.from} → ${e.period.to} · ${t("extractionFilters")}: ${e.filters}
     </div>
     ${actions}
    </div>`;}).join('')}</div>`}
  </div>`;
 },
};
function renderView(){document.getElementById("main").innerHTML=(VIEWS[state.view]||VIEWS.home)();}

/* init login language strings */
applyLogin();
</script>
